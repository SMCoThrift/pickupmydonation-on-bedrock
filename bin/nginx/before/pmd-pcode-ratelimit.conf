# Rate-limit the zip-code lookup when it arrives with no Referer.
#
# A residential proxy pool walks /select-your-organization/?pcode=<zip> in
# waves of 40-160 requests/minute, one request per IP, rotating browser UAs,
# no Referer (incident 2026-10-14). The page is uncacheable by design, so each
# hit is a full PHP render, and the waves filled the 6-worker pool. Per-IP
# limits are useless against one-request-per-IP, so this is ONE shared bucket
# for every no-Referer lookup; lookups with a Referer (donors coming from the
# homepage form, ~5,000/day) get an empty key and are never counted.
#
# Measured baseline for no-Referer lookups, 2026-09-30..10-12: 159-480/day,
# busiest minute 11 (one 27/min facebookexternalhit spike on 10-04).
map "$http_referer:$request_uri" $pmd_pcode_noref_key {
    "~^:/select-your-organization/?\?(.*&)?pcode=" "pcode-noref";
    default "";
}

limit_req_zone $pmd_pcode_noref_key zone=pmd_pcode_noref:1m rate=20r/m;
