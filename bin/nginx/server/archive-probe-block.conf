# Backup/archive filename probes (/backup.zip, /site.7z, /.env.bak.zip ...).
# No such files exist under the web root (checked 2026-10-14), but without
# this they fall through to try_files -> index.php and boot WordPress: a
# single scanner sent ~2,900/min on 2026-10-01 and wedged the pool.
# .gz is already handled as a static file by SpinupWP's static-files.conf.
location ~* \.(zip|7z|tar|tgz|rar|bz2|xz|bak|sql)$ {
    try_files $uri =404;
}
