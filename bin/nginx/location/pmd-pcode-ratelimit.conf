# Applies the shared no-Referer bucket defined in before/pmd-pcode-ratelimit.conf.
# Only requests whose key is non-empty are counted; everything else passes.
# 20/min sustained plus a burst of 20 is ~2x the busiest legitimate minute.
limit_req zone=pmd_pcode_noref burst=20 nodelay;
limit_req_status 429;
